# Render Blueprint for the backend.

services:
  - type: web
    name: alphatest-api
    runtime: python
    plan: free 
    # Both commands run from the repo root: main.py imports `backend.app.*`,
    # so the app can't be started from inside backend/.
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/health
